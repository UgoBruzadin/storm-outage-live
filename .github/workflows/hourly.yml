name: Hourly forecast

on:
  schedule:
    # GitHub drops many scheduled runs, so each hour gets several chances (from :23: the newest HRRR run is ~2 h behind).
    # The first forecast saved for an hour stands.
    - cron: "23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Is this hour still to do?
        id: hour
        run: |
          echo "hour=$(date -u +%Y-%m-%dT%H)" >> "$GITHUB_OUTPUT"
          echo "path=$(date -u +%Y/%m/%d/%H)" >> "$GITHUB_OUTPUT"
          if [ -e "predictions/$(date -u +%Y/%m/%d/%H).parquet" ]; then
            echo "This hour's forecast is already saved."
          elif [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%-M)" -lt 15 ]; then
            echo "A delayed run from last hour: the newest HRRR run isn't in yet, so a later attempt takes this hour."
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the frozen model and code
        if: steps.hour.outputs.todo
        uses: actions/checkout@v4
        with:
          repository: UgoBruzadin/storm-outage-risk
          ref: live-v1.1
          path: code
          sparse-checkout: |
            live
            ingest
            ml
            requirements-live.txt

      - uses: actions/setup-python@v5
        if: steps.hour.outputs.todo
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/requirements-live.txt

      - name: Install
        if: steps.hour.outputs.todo
        run: pip install -r code/requirements-live.txt

      - name: Forecast the current hour
        if: steps.hour.outputs.todo
        working-directory: code
        run: python -m live.predict --hour "${{ steps.hour.outputs.hour }}" --out "$GITHUB_WORKSPACE" --inputs

      - name: Commit
        if: steps.hour.outputs.todo
        run: |
          git config user.name "storm-outage-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "hours/$(dirname "${{ steps.hour.outputs.path }}")"
          cp latest.json "hours/${{ steps.hour.outputs.path }}.json"      # the story page's past 12 hours
          git add latest.json hours predictions inputs
          git diff --cached --quiet && exit 0
          git commit -q -m "Forecast $(python -c 'import json; print(json.load(open("latest.json"))["decision_hour"])')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
