name: Hourly forecast

on:
  schedule:
    - cron: "20 * * * *"          # :20 past each hour (the newest HRRR run is ~2 h behind; this gives it time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Get the frozen model and code
        uses: actions/checkout@v4
        with:
          repository: UgoBruzadin/storm-outage-risk
          ref: live-v1
          path: code
          sparse-checkout: |
            live
            ingest
            ml
            requirements-live.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/requirements-live.txt

      - name: Install
        run: pip install -r code/requirements-live.txt

      - name: Forecast the current hour
        working-directory: code
        run: python -m live.predict --out "$GITHUB_WORKSPACE" --inputs

      - name: Commit
        run: |
          git config user.name "storm-outage-live bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json predictions inputs
          git diff --cached --quiet && exit 0
          git commit -q -m "Forecast $(python -c 'import json; print(json.load(open("latest.json"))["decision_hour"])')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
